services:
  telecloud-vault:
    build: .
    container_name: telecloud-vault
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Points at your own external PostgreSQL instance — set the real value in .env.
      # Example: postgresql://user:password@db.example.com:5432/telecloud_vault?sslmode=require
      - DATABASE_URL=${DATABASE_URL}
      - VAULT_MASTER_KEY=${VAULT_MASTER_KEY:-8f4e2a9c1b7d6e3f5a0c9b8d7e6f5a4b3c2d1e0f9a8b7c6d5e4f3a2b1c0d9e8f}
      # Only takes effect on a brand-new, never-initialized database (sets the master password
      # automatically on first boot instead of needing the Unlock screen's first-run setup).
      # Has no effect once a vault already exists — change an existing password from the app's
      # Credentials & Security tab instead.
      - VAULT_INITIAL_PASSWORD=${VAULT_INITIAL_PASSWORD:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}

  nginx:
    image: nginx:1.27-alpine
    container_name: telecloud-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - telecloud-vault
