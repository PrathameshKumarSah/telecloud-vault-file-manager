services:
  - type: web
    name: telecloud-vault
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /
    envVars:
      # Set these real values in the Render dashboard after the Blueprint is created —
      # they are intentionally NOT stored in this repo (sync: false prompts for them).
      - key: DATABASE_URL
        sync: false
      - key: VAULT_MASTER_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: VAULT_INITIAL_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: "*"
